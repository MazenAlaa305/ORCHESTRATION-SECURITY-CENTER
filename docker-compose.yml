services:
  # ── TLS reverse proxy ──────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: sme_dashboard_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  backend:
    build: ./backend
    container_name: sme_dashboard_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/sme_cyber_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      - OPENVAS_HOST=openvas
      - OPENVAS_PORT=9390
      - OPENVAS_CONNECTION_TYPE=tls
      - OPENVAS_ENABLED=false
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SIEM_ENABLED=false
      - WAZUH_API_URL=https://wazuh:55000
      - WAZUH_API_USER=wazuh
      - WAZUH_API_PASSWORD=wazuh
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/
      - SOAR_ENABLED=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: sme_dashboard_frontend
    environment:
      - VITE_API_URL=https://localhost/api/v1
    depends_on:
      - backend
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 48M

  db:
    image: postgres:15-alpine
    container_name: sme_dashboard_db
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=128MB
      -c checkpoint_completion_target=0.9
      -c max_connections=30
      -c wal_buffers=4MB
      -c synchronous_commit=off
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=sme_cyber_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sme_cyber_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: sme_dashboard_redis
    command: >
      redis-server
      --maxmemory 80mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 96M
    ports:
      - "6379:6379"

  celery_worker:
    build: ./backend
    container_name: sme_dashboard_celery
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=1
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.3'
          memory: 128M
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/sme_cyber_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SIEM_ENABLED=false
      - WAZUH_API_URL=https://wazuh:55000
      - WAZUH_API_USER=wazuh
      - WAZUH_API_PASSWORD=wazuh
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/
      - SOAR_ENABLED=false
    networks:
      - default
      - lab_network
    depends_on:
      - backend
      - redis

  # ── Heavy optional services (only start with: docker compose --profile full up) ──

  celery_beat:
    profiles: ["full"]
    build: ./backend
    container_name: sme_dashboard_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/sme_cyber_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - WAZUH_API_URL=https://wazuh:55000
      - WAZUH_API_USER=wazuh
      - WAZUH_API_PASSWORD=wazuh
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/
    depends_on:
      - backend
      - redis

  openvas:
    profiles: ["full"]
    image: immauss/openvas
    container_name: sme_dashboard_openvas
    restart: unless-stopped
    environment:
      - PUBLIC_HOSTNAME=127.0.0.1
      - SKIPGSAD=true
    ports:
      - "9392:9392"
      - "9390:9390"
    volumes:
      - gvm_data:/var/lib/openvas
    entrypoint: [ "/bin/sh", "-c", "chown -R gvm:gvm /var/lib/openvas && rm -f /var/lib/openvas/feed-update.lock && find /var/lib -name postmaster.pid -delete && /scripts/start.sh" ]
    networks:
      - default
      - lab_network

  elasticsearch:
    profiles: ["full"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: sme_dashboard_elastic
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      lab_network:
        aliases:
          - wazuh.indexer

  kibana:
    profiles: ["full"]
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: sme_dashboard_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - lab_network

  wazuh:
    profiles: ["full"]
    image: wazuh/wazuh-manager:4.7.2
    container_name: sme_dashboard_wazuh
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    environment:
      - WAZUH_API_START="true"
    networks:
      - lab_network

  n8n:
    profiles: ["full"]
    image: n8nio/n8n:latest
    container_name: sme_dashboard_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - default
      - lab_network

networks:
  default:
  lab_network:
    external: true
    name: the-dashboard-project-_lab_network

volumes:
  postgres_data:
  gvm_data:
  elastic_data:
  n8n_data:
  caddy_data:
  caddy_config:
