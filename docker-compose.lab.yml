# ════════════════════════════════════════════════════════════
# NETWORK DEFINITIONS
# ════════════════════════════════════════════════════════════

networks:
  dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1
  corp:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.20.0/24
          gateway: 10.10.20.1
  data:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.30.0/24
          gateway: 10.10.30.1
  mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.40.0/24
          gateway: 10.10.40.1
  lab_network:
    external: true
    name: the-dashboard-project-_lab_network

# ════════════════════════════════════════════════════════════
# VOLUMES
# ════════════════════════════════════════════════════════════

volumes:
  lab_traffic_logs:
    driver: local
