# ============================================================
# TARGET RANGE ENVIRONMENT - Found 404
# Deterministic Security Orchestration Lab
# Models a 3-tier SME architecture with realistic targets.
# ============================================================

services:

  # ──────────────────────────────────────────────────────────
  # 1. THE BROKEN WEB APP (Frontend DMZ)
  # Persona: An intentionally vulnerable e-commerce platform
  # Vulnerabilities: BOLA, SQLi
  # Expected Risk Score: 9.5 (Critical)
  # ──────────────────────────────────────────────────────────
  lab_broken_web:
    image: bkimminich/juice-shop:latest
    container_name: lab_broken_web
    ports:
      - "3000:3000"
    networks:
      - frontend-dmz
      - lab_network
    labels:
      lab.persona: "broken-web-app"
      lab.vulns: "bola,sqli"
      lab.target_score: "9.5"
      lab.description: "Intentionally vulnerable Node.js web app (OWASP Juice Shop) exposing BOLA and SQL Injection flaws."

  # ──────────────────────────────────────────────────────────
  # 2. THE API GATEWAY (Frontend DMZ)
  # Persona: Legacy API Gateway
  # Vulnerabilities: Information Disclosure (Old headers, Swagger DB)
  # Expected Risk Score: 6.0 (Medium)
  # ──────────────────────────────────────────────────────────
  lab_api_gateway:
    image: nginx:alpine
    container_name: lab_api_gateway
    command: >
      sh -c "echo 'server { listen 8081; location / { default_type application/json; return 200 \"{\\\"swagger\\\": \\\"2.0\\\", \\\"info\\\": {\\\"title\\\": \\\"Internal API\\\"}}\"; add_header Server \"Apache/2.2.14 (Unix)\"; add_header X-Powered-By \"PHP/5.3.2\"; } }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    ports:
      - "8081:8081"
    networks:
      - frontend-dmz
      - lab_network
    labels:
      lab.persona: "api-gateway"
      lab.vulns: "info-disclosure,swagger"
      lab.target_score: "6.0"
      lab.description: "Exposed REST API with outdated documentation and verbose Server headers."

  # ──────────────────────────────────────────────────────────
  # 3. THE MISCONFIGURED INFRASTRUCTURE (Internal Servers)
  # Persona: Forgotten corporate file server
  # Vulnerabilities: Exposed SMB, Weak/Default Credentials
  # Expected Risk Score: 8.0 (High)
  # ──────────────────────────────────────────────────────────
  lab_misconfig_infra:
    image: dperson/samba:latest
    container_name: lab_misconfig_infra
    # Ports published to host for simulated network scans (mapped to avoid Windows conflict)
    ports:
      - "4445:445"
      - "1139:139"
    command: >
      -u "admin;admin123" -u "guest;guest"
      -s "public;/public;yes;no;no;all;none;"
      -s "confidential;/confidential;no;no;no;admin;none;"
    networks:
      - internal-srv
      - lab_network
    labels:
      lab.persona: "misconfigured-infra"
      lab.vulns: "default-login,misconfig,smb-enum"
      lab.target_score: "8.0"
      lab.description: "Windows/Linux Samba server with weak admin credentials (admin123) and exposed data."

  # ──────────────────────────────────────────────────────────
  # 4. THE SHADOW IT ASSET (Data Vault)
  # Persona: Unmanaged in-memory datastore
  # Vulnerabilities: Non-standard port, Unauthenticated access
  # Expected Risk Score: 8.5 (High)
  # ──────────────────────────────────────────────────────────
  lab_shadow_asset:
    image: redis:6.0-alpine
    container_name: lab_shadow_asset
    command: redis-server --port 63790 --protected-mode no --bind 0.0.0.0
    ports:
      - "63790:63790"
    networks:
      - data-vault
      - lab_network
    labels:
      lab.persona: "shadow-it"
      lab.vulns: "redis-unauthenticated,misconfig"
      lab.target_score: "8.5"
      lab.description: "Forgotten Redis instance running on port 63790 without authentication bounds."

# ──────────────────────────────────────────────────────────
# MULTI-SUBNET ARCHITECTURE
# ──────────────────────────────────────────────────────────
networks:
  frontend-dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
  internal-srv:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.20.0/24
  data-vault:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.30.0/24
  lab_network:
    external: true
    name: the-dashboard-project-_lab_network
