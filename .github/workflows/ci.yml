name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sme_cyber_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Install nmap (needed by python-nmap import)
        run: sudo apt-get update && sudo apt-get install -y nmap

      - name: Lint with ruff (non-blocking)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check backend/app

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/sme_cyber_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-jwt-secret-do-not-use-in-prod
          CREDENTIAL_ENCRYPTION_KEY: fNEmlUybd-2H4cKUUgLCnZx7iWP1a4_T2GJPg7cN0k0=
          GEMINI_API_KEY: ""
          SKIP_SECRET_VALIDATION: "1"
          PYTHONPATH: backend
        run: pytest backend/tests -v --maxfail=3

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

      - name: Trivy image scan (backend, non-blocking)
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'the-dashboard-project--backend:latest'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'
