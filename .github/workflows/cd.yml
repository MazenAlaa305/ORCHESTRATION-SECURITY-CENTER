name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

      - name: Tag images with commit SHA
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          docker tag the-dashboard-project--backend:latest the-dashboard-project--backend:${SHA_SHORT}
          docker tag the-dashboard-project--frontend:latest the-dashboard-project--frontend:${SHA_SHORT}

      # Replace this step with your real deploy target (SSH, ECR push, k8s apply, etc.).
      - name: Deploy placeholder
        run: |
          echo "Deploy step is a placeholder."
          echo "Wire this to your infra target (e.g. AWS ECR + ECS, GHCR + Watchtower, ssh-action)."
